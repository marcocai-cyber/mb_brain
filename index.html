<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>MatchBetting Assistant</title>
<script>
  // Parametro che cambia ad ogni apertura: forza il browser a scaricare una
  // copia fresca di MatchBetting_Assistant.html invece di riusarne una
  // vecchia dalla cache (risolve il problema "aggiorno la pagina ma non vedo
  // le modifiche" per chi apre l'app da questo indirizzo, es. dai preferiti).
  location.replace('MatchBetting_Assistant.html?v=' + Date.now());
</script>
</head>
<body>
  <p>Apertura di MatchBetting Assistant... se non parte automaticamente,
  <a href="MatchBetting_Assistant.html">clicca qui</a>.</p>
</body>
</html>
